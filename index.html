<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCRIMZONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=Saira:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b13;--panel:#0d1522;--panel-hi:#132234;--line:#253750;--gold:#e3b23c;--gold-hi:#f6dc8e;--ink:#e9eff7;--dim:#8fa0b6;--cond:"Saira Condensed","Arial Narrow",sans-serif;--disp:"Saira",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0%,#172b43 0,#0a111c 42%,var(--bg) 78%);color:var(--ink);font-family:var(--disp)}
main{width:min(620px,100%);border:1px solid var(--line);background:rgba(13,21,34,.94);box-shadow:0 24px 70px rgba(0,0,0,.45);padding:32px}
.eyebrow{color:var(--gold);font:700 12px var(--cond);letter-spacing:.3em;margin-bottom:8px}
h1{font:700 clamp(38px,8vw,64px)/.9 var(--cond);letter-spacing:.04em;text-transform:uppercase}
p{margin-top:14px;color:var(--dim);font-size:13px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}
a{display:flex;align-items:center;justify-content:center;min-height:58px;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel-hi),var(--panel));color:var(--ink);text-decoration:none;font:700 15px var(--cond);letter-spacing:.12em;text-transform:uppercase}
a:hover{border-color:var(--gold);color:var(--gold-hi);transform:translateY(-2px)}
@media(max-width:520px){main{padding:24px}nav{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">ESPORTS BROADCAST SYSTEM</div>
  <h1>SCRIMZONE</h1>
  <p>Choose a view to open the tournament tools.</p>
  <nav>
    <a href="./controller.html">Controller</a>
    <a href="./overlay.html" target="_blank" rel="noopener">Overlay</a>
    <a href="./history.html">History</a>
  </nav>
</main>
</body>
</html>
